}.badge{font-size:12px;background:#e8eefc;color:#2448a5;padding:2px 6px;border-radius:999px}.prog{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:7px}.bar{height:100%;background:linear-gradient(90deg,#1f4ed8,#15803d);transition:width .25s}.hint{font-size:12px;color:var(--m);margin:-6px 0 14px}.doneflash{outline:3px solid #86efac}.toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 10px 30px #0003;z-index:20;display:none}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.add,.fields{grid-template-columns:1fr}.row{grid-template-columns:auto 1fr}.row .act{grid-column:1/-1}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.bigpct{font-size:28px!important}}</style></head><body><header><div class="w"><h1>EJ ApS · To Do</h1><div class="sub">Fælles opstartsplan, ansvar og tidsfrister</div></div></header><main class="w"><section class="stats"><div class="s">I alt<b id="tot">0</b></div><div class="s">Færdige<b id="dn">0</b></div><div class="s">Åbne<b id="op">0</b></div><div class="s progressbox">Fremdrift<b class="bigpct" id="pc">0%</b><div class="prog"><div class="bar" id="bar"></div></div></div></section><section class="tools"><input id="q" placeholder="Søg..." style="max-width:260px"><select id="of" style="max-width:170px"><option value="all">Alle ansvarlige</option><option>Emil</option><option>Jesper</option><option>Fælles</option></select><select id="sf" style="max-width:150px"><option value="all">Alle</option><option value="open">Åbne</option><option value="done">Færdige</option></select><select id="df" style="max-width:170px"><option value="all">Alle tidsfrister</option><option value="today">I dag</option><option value="week">Denne uge</option><option value="over">Overskredet</option></select><button id="notify" class="n">Aktivér notifikationer</button><button id="cal">Eksportér kalender</button></section><div class="hint">Når notifikationer er tilladt, viser appen en systemnotifikation, når en opgave markeres færdig. Tidsfristpåmindelser kan eksporteres til kalenderen, så de kan vises på låseskærmen.</div><section class="add"><div><label>Ny opgave</label><input id="nt"></div><div><label>Kategori</label><select id="nc"></select></div><div><label>Ansvarlig</label><select id="no"><option>Fælles</option><option>Emil</option><option>Jesper</option></select></div><div><label>Dato</label><input id="nd" type="date"></div><div><label>Tid</label><input id="nTime" type="time" value="09:00"></div><button class="p" id="add">Tilføj</button></section><div id="root"></div></main><div id="toast" class="toast"></div><script>const C=["1. Aftal rammerne mellem ejerne","2. Lav ejeraftale","3. Stift selskabet","4. Ejerforhold","5. Bank, skat og økonomi","6. Praktisk drift","7. Før I går i gang"],D=[["Aftal ejerfordeling, fx 50/50 eller 60/40",0],["Aftal hvem der indskyder hvor meget",0],["Aftal roller og arbejdsfordeling",0],["Aftal om begge skal være direktører",0],["Aftal løn og eventuelle udlæg",0],["Beslut hvordan større beslutninger træffes",0],["Tal om, hvad der sker, hvis én vil ud af selskabet",0],["Udarbejd ejeraftale",1],["Regler om salg/overdragelse af anparter",1],["Forkøbsret",1],["Håndtering af 50/50-deadlock",1],["Good leaver/bad leaver",1],["Sygdom/dødsfald",1],["Konkurrence- og kundeklausuler, hvor relevant",1],["Rettigheder til software, domæner, IP mv.",1],["Udbyttepolitik",1],["Få evt. advokat til at gennemgå aftalen",1],["Vælg selskabsnavn",2],["Vælg adresse",2],["Fastlæg selskabets formål",2],["Fastlæg regnskabsår",2],["Udarbejd stiftelsesdokument",2],["Udarbejd vedtægter",2],["Indbetal selskabskapital",2],["Dokumentér kapitalen",2],["Registrér ApS'et hos Erhvervsstyrelsen",2],["Modtag CVR-nummer",2],["Opret ejerbog",3],["Registrér legale ejere",3],["Registrér reelle ejere",3],["Overvej privat ejerskab eller holdingselskaber",3],["Opret erhvervskonto",4],["Registrér selskabet for moms, hvis relevant",4],["Registrér som arbejdsgiver, hvis I skal have løn",4],["Vælg bogføringssystem",4],["Opsæt fakturering",4],["Opsæt bilag/kvitteringer",4],["Lav budget og likviditetsbudget",4],["Aftal opgaver med revisor/bogholder",4],["Køb domæne",5],["Opret firma-mail",5],["Tegn relevante forsikringer",5],["Lav standardtilbud/-kontrakter",5],["Lav handelsbetingelser, hvis relevant",5],["GDPR/persondatapolitik",5],["Databehandleraftaler, hvis nødvendigt",5],["Overfør relevante IP-rettigheder til selskabet",5],["Sørg for at alle aftaler mellem jer er på skrift",6],["Undgå private og selskabets penge på samme konto",6],["Aftal godkendelsesgrænser for større køb",6],["Aftal månedlig økonomiopfølgning",6],["Lav plan for de første 3–6 måneders kapitalbehov",6]];const K="ejaps_online_v1";let T=load();function load(){try{let x=JSON.parse(localStorage.getItem(K));if(Array.isArray(x))return x}catch(e){}return D.map((x,i)=>({id:i+1,title:x[0],cat:C[x[1]],done:false,owner:"Fælles",date:"",time:"09:00",rem:"-P1D",notes:""}))}function pct(){let d=T.filter(x=>x.done).length;return T.length?Math.round(d/T.length*100):0}function save(){localStorage.setItem(K,JSON.stringify(T));render()}function e(s){return String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function stats(){let d=T.filter(x=>x.done).length,p=pct();tot.textContent=T.length;dn.textContent=d;op.textContent=T.length-d;pc.textContent=p+"%";bar.style.width=p+"%";if('setAppBadge'in navigator){let open=T.length-d;open?navigator.setAppBadge(open):navigator.clearAppBadge()}}function render(){stats();let s=q.value.toLowerCase(),now=new Date(),today=new Date().toISOString().slice(0,10),wd=(now.getDay()+6)%7,mo=new Date(now);mo.setHours(0,0,0,0);mo.setDate(now.getDate()-wd);let su=new Date(mo);su.setDate(mo.getDate()+6);su.setHours(23,59,59,999);root.innerHTML=C.map(c=>{let all=T.filter(x=>x.cat===c),arr=all.filter(x=>{let m=(x.title+" "+x.notes+" "+x.owner).toLowerCase().includes(s),a=of.valu }>2 dage før</option><option value="-P7D" ${x.rem==='-P7D'?'selected':''}>1 uge før</option></select></div></div><div class="notes"><label>Noter</label><textarea rows="2" oninput="upd(${x.id},'notes',this.value,false)">${e(x.notes)}</textarea></div></div>`}async function systemNote(title,body){try{if(Notification.permission!=="granted")return;if('serviceWorker'in navigator){let r=await navigator.serviceWorker.ready;await r.showNotification(title,{body,icon:'icon.svg',badge:'icon.svg',tag:'ejaps-status'})}else new Notification(title,{body})}catch(e){}}function toastMsg(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',3000)}window.tog=id=>{let x=T.find(y=>y.id===id),was=x.done;x.done=!x.done;localStorage.setItem(K,JSON.stringify(T));render();if(!was&&x.done){let p=pct();systemNote('EJ ApS · Opgave færdig',`${x.title} · Fremdrift ${p}%`);toastMsg(`Færdig: ${x.title} · ${p}% gennemført`)}};window.upd=(id,f,v,r=true)=>{let x=T.find(y=>y.id===id);x[f]=v;localStorage.setItem(K,JSON.stringify(T));if(r)render();else stats()};window.del=id=>{if(confirm("Slet opgaven?")){T=T.filter(x=>x.id!==id);save()}};notify.onclick=async()=>{if(!('Notification'in window))return alert('Denne browser understøtter ikke systemnotifikationer.');let p=await Notification.requestPermission();if(p==='granted'){notify.textContent='Notifikationer aktive';toastMsg('Notifikationer er aktiveret')}else alert('Notifikationer blev ikke tilladt. Du kan ændre det i browserens indstillinger.')};function escI(s){return String(s??"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")}function ve(x){if(!x.date)return"";let tm=(x.time||"09:00").replace(":",""),st=x.date.replaceAll("-","")+"T"+tm+"00",en=new Date(x.date+"T"+(x.time||"09:00"));en.setMinutes(en.getMinutes()+30);let p=n=>String(n).padStart(2,"0"),ed=`${en.getFullYear()}${p(en.getMonth()+1)}${p(en.getDate())}T${p(en.getHours())}${p(en.getMinutes())}00`,a=["BEGIN:VEVENT",`UID:ejaps-${x.id}@todo`,`DTSTART;TZID=Europe/Copenhagen:${st}`,`DTEND;TZID=Europe/Copenhagen:${ed}`,`SUMMARY:${escI(x.title)}`,`DESCRIPTION:${escI("Kategori: "+x.cat+"\nAnsvarlig: "+x.owner+(x.notes?"\nNoter: "+x.notes:""))}`];if(x.rem)a.push("BEGIN:VALARM",`TRIGGER:${x.rem}`,"ACTION:DISPLAY",`DESCRIPTION:${escI("Påmindelse: "+x.title)}`,"END:VALARM");a.push("END:VEVENT");return a.join("\r\n")}function dl(name,text){let b=new Blob([text],{type:"text/calendar;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click()}window.icsOne=id=>{let x=T.find(y=>y.id===id);if(!x.date)return alert("Tilføj først en dato");dl("EJ-ApS-opgave.ics",["BEGIN:VCALENDAR","VERSION:2.0",ve(x),"END:VCALENDAR"].join("\r\n"))};cal.onclick=()=>{let a=T.filter(x=>x.date);if(!a.length)return alert("Ingen tidsfrister endnu");dl("EJ-ApS-deadlines.ics",["BEGIN:VCALENDAR","VERSION:2.0",...a.map(ve),"END:VCALENDAR"].join("\r\n"))};add.onclick=()=>{if(!nt.value.trim())return;T.push({id:Date.now(),title:nt.value.trim(),cat:nc.value,done:false,owner:no.value,date:nd.value,time:nTime.value||"09:00",rem:"-P1D",notes:""});nt.value="";save()};[q,of,sf,df].forEach(x=>x.oninput=render);nc.innerHTML=C.map(x=>`<option>${e(x)}</option>`).join("");if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');if(Notification.permission==='granted')notify.textContent='Notifikationer aktive';render()</script></body></html>
