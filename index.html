<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>EJ ApS To Do</title><style>:root{--bg:#f4f6f8;--card:#fff;--text:#172033;--muted:#667085;--line:#dfe3e8;--accent:#1f4ed8;--danger:#b91c1c;--ok:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:#111827;color:#fff;padding:20px;position:sticky;top:0;z-index:5}.wrap{max-width:1120px;margin:auto}h1{margin:0;font-size:26px}.sub{color:#cbd5e1;margin-top:4px}main{padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.card,.tools,.add,.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.card b{font-size:23px;display:block}.progress-card{background:#eef4ff;border-color:#c7d7fe}.bigpct{font-size:34px!important;color:var(--accent)}.prog{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:7px}.bar{height:100%;background:linear-gradient(90deg,#1f4ed8,#15803d);transition:width .25s}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.hint{font-size:12px;color:var(--muted);margin:0 2px 14px}.add{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:16px;align-items:end}input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;background:#fff}button{border:0;border-radius:8px;padding:8px 10px;cursor:pointer}.primary{background:var(--accent);color:#fff}.notify{background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.cat{margin:16px 0}.cathead{background:#e9edf4;border:1px solid #d8dee8;padding:11px;border-radius:10px;font-weight:700}.badge{font-size:12px;background:#e8eefc;color:#2448a5;padding:2px 6px;border-radius:999px}.task{margin-top:8px}.task.done{opacity:.62}.task.done .title{text-decoration:line-through}.task.overdue{border-left:4px solid var(--danger)}.row{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}.notes{margin-top:8px}.toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 10px 30px #0003;z-index:20;display:none}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.add,.fields{grid-template-columns:1fr}.row{grid-template-columns:auto 1fr}.row .actions{grid-column:1/-1}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.bigpct{font-size:28px!important}}</style></head><body><header><div class="wrap"><h1>EJ ApS · To Do</h1><div class="sub">Fælles opstartsplan, ansvar, tidsfrister og fremdrift</div></div></header><main class="wrap"><section class="stats"><div class="card">I alt<b id="total">0</b></div><div class="card">Færdige<b id="done">0</b></div><div class="card">Åbne<b id="open">0</b></div><div class="card progress-card">Fremdrift<b class="bigpct" id="percent">0%</b><div class="prog"><div class="bar" id="bar"></div></div></div></section><section class="tools"><input id="search" placeholder="Søg..." style="max-width:260px"><select id="ownerFilter" style="max-width:170px"><option value="all">Alle ansvarlige</option><option>Emil</option><option>Jesper</option><option>Fælles</option></select><select id="statusFilter" style="max-width:150px"><option value="all">Alle</option><option value="open">Åbne</option><option value="done">Færdige</option></select><select id="deadlineFilter" style="max-width:170px"><option value="all">Alle tidsfrister</option><option value="today">I dag</option><option value="week">Denne uge</option><option value="overdue">Overskredet</option></select><button id="notifyBtn" class="notify">Aktivér notifikationer</button><button id="calendarBtn">Eksportér kalender</button></section><div class="hint">Når notifikationer er tilladt, viser appen besked ved færdiggjorte opgaver. Kalenderpåmindelser bruges til tidsfrister på låseskærmen.</div><section class="add"><div><label>Ny opgave</label><input id="newTitle"></div><div><label>Kategori</label><select id="newCategory"></select></div><div><label>Ansvarlig</label><select id="newOwner"><option>Fælles</option><option>Emil</option><option>Jesper</option></select></div><div><label>Dato</label><input id="newDate" type="date"></div><div><label>Tid</label><input id="newTime" type="time" value="09:00"></div><button class="primary" id="addBtn">Tilføj</button></section><div id="root"></div></main><div id="toast" class="toast"></div><script>const C=["1. Aftal rammerne mellem ejerne","2. Lav ejeraftale","3. Stift selskabet","4. Ejerforhold","5. Bank, skat og økonomi","6. Praktisk drift","7. Før I går i gang"];const D=[["Aftal ejerfordeling, fx 50/50 eller 60/40",0],["Aftal hvem der indskyder hvor meget",0],["Aftal roller og arbejdsfordeling",0],["Aftal om begge skal være direktører",0],["Aftal løn og eventuelle udlæg",0],["Beslut hvordan større beslutninger træffes",0],["Tal om, hvad der sker, hvis én vil ud af selskabet",0],["Udarbejd ejeraftale",1],["Regler om salg/overdragelse af anparter",1],["Forkøbsret",1],["Håndtering af 50/50-deadlock",1],["Good leaver/bad leaver",1],["Sygdom/dødsfald",1],["Konkurrence- og kundeklausuler, hvor relevant",1],["Rettigheder til software, domæner, IP mv.",1],["Udbyttepolitik",1],["Få evt. advokat til at gennemgå aftalen",1],["Vælg selskabsnavn",2],["Vælg adresse",2],["Fastlæg selskabets formål",2],["Fastlæg regnskabsår",2],["Udarbejd stiftelsesdokument",2],["Udarbejd vedtægter",2],["Indbetal selskabskapital",2],["Dokumentér kapitalen",2],["Registrér ApS'et hos Erhvervsstyrelsen",2],["Modtag CVR-nummer",2],["Opret ejerbog",3],["Registrér legale ejere",3],["Registrér reelle ejere",3],["Overvej om I skal eje privat eller via hvert jeres holdingselskab inden strukturen låses fast",3],["Opret erhvervskonto",4],["Registrér selskabet for moms, hvis relevant",4],["Registrér som arbejdsgiver, hvis I skal have løn",4],["Vælg bogføringssystem",4],["Opsæt fakturering",4],["Opsæt bilag/kvitteringer",4],["Lav budget og likviditetsbudget",4],["Aftal med revisor/bogholder, hvem der håndterer moms, løn og årsrapport",4],["Køb domæne",5],["Opret firma-mail",5],["Tegn relevante forsikringer",5],["Lav standardtilbud/-kontrakter",5],["Lav handelsbetingelser, hvis relevant",5],["GDPR/persondatapolitik",5],["Databehandleraftaler, hvis nødvendigt",5],["Overfør relevante IP-rettigheder til selskabet",5],["Sørg for at alle aftaler mellem jer er på skrift",6],["Undgå private og selskabets penge på samme konto",6],["Aftal godkendelsesgrænser for større køb",6],["Aftal månedlig økonomiopfølgning",6],["Lav plan for de første 3–6 måneders kapitalbehov",6]];const KEY="ejaps_online_v2";let tasks=load();function defaultTasks(){return D.map((x,i)=>({id:i+1,title:x[0],cat:C[x[1]],done:false,owner:"Fælles",date:"",time:"09:00",rem:"-P1D",notes:""}))}function load(){try{const old=JSON.parse(localStorage.getItem("ejaps_online_v1"));const cur=JSON.parse(localStorage.getItem(KEY));const base=Array.isArray(cur)?cur:Array.isArray(old)?old:[];if(base.length){const byTitle=new Map(base.map(x=>[x.title,x]));return defaultTasks().map((d,i)=>{const exact=byTitle.get(d.title);if(exact)return {...d,...exact,title:d.title,cat:d.cat};const prior=base[i];return prior?{...d,done:!!prior.done,owner:["Emil","Jesper","Fælles"].includes(prior.owner)?prior.owner:"Fælles",date:prior.date||"",time:prior.time||"09:00",rem:prior.rem||"-P1D",notes:prior.notes||""}:d}).concat(base.filter(x=>x.id>52||!D.some(d=>d[0]===x.title)))} }catch(e){}return defaultTasks()}function esc(s){return String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function pct(){const d=tasks.filter(x=>x.done).length;return tasks.length?Math.round(d/tasks.length*100):0}function persist(redraw=true){localStorage.setItem(KEY,JSON.stringify(tasks));if(redraw)render()}function stats(){const d=tasks.filter(x=>x.done).length,p=pct();total.textContent=tasks.length;done.textContent=d;open.textContent=tasks.length-d;percent.textContent=p+"%";bar.style.width=p+"%";if("setAppBadge" in navigator){const n=tasks.length-d;n?navigator.setAppBadge(n):navigator.clearAppBadge()}}function render(){stats();const q=search.value.toLowerCase(),now=new Date(),today=new Date().toISOString().slice(0,10),wd=(now.getDay()+6)%7,monday=new Date(now);monday.setHours(0,0,0,0);monday.setDate(now.getDate()-wd);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);root.innerHTML=C.map(cat=>{const all=tasks.filter(x=>x.cat===cat),filtered=all.filter(x=>{const match=(x.title+" "+x.notes+" "+x.owner).toLowerCase().includes(q),owner=ownerFilter.value==="all"||x.owner===ownerFilter.value,status=statusFilter.value==="all"||(statusFilter.value==="open"&&!x.done)||(statusFilter.value==="done"&&x.done);let deadline=true;if(deadlineFilter.value!=="all"){if(!x.date)deadline=false;else{const dt=new Date(x.date+"T"+(x.time||"23:59"));if(deadlineFilter.value==="today")deadline=x.date===today;if(deadlineFilter.value==="week")deadline=dt>=monday&&dt<=sunday;if(deadlineFilter.value==="overdue")deadline=!x.done&&dt<now}}return match&&owner&&status&&deadline});const cp=all.length?Math.round(all.filter(x=>x.done).length/all.length*100):0;return `<section class="cat"><div class="cathead">${esc(cat)} <span class="badge">${all.filter(x=>x.done).length}/${all.length} · ${cp}%</span></div>${filtered.map(taskCard).join("")}</section>`}).join("")}function taskCard(x){const overdue=x.date&&!x.done&&new Date(x.date+"T"+(x.time||"23:59"))<new Date();return `<div class="task ${x.done?"done":""} ${overdue?"overdue":""}"><div class="row"><input type="checkbox" ${x.done?"checked":""} onchange="toggleTask(${x.id})"><div class="title"><b>${esc(x.title)}</b></div><div class="actions"><button onclick="oneCalendar(${x.id})">Til kalender</button> <button class="danger" onclick="deleteTask(${x.id})">Slet</button></div></div><div class="fields"><div><label>Ansvarlig</label><select onchange="updateTask(${x.id},'owner',this.value)"><option ${x.owner==='Fælles'?'selected':''}>Fælles</option><option ${x.owner==='Emil'?'selected':''}>Emil</option><option ${x.owner==='Jesper'?'selected':''}>Jesper</option></select></div><div><label>Tidsfrist dato</label><input type="date" value="${esc(x.date)}" onchange="updateTask(${x.id},'date',this.value)"></div><div><label>Klokkeslæt</label><input type="time" value="${esc(x.time||'09:00')}" onchange="updateTask(${x.id},'time',this.value)"></div><div><label>Påmindelse</label><select onchange="updateTask(${x.id},'rem',this.value)"><option value="-PT30M" ${x.rem==='-PT30M'?'selected':''}>30 min før</option><option value="-PT1H" ${x.rem==='-PT1H'?'selected':''}>1 time før</option><option value="-PT2H" ${x.rem==='-PT2H'?'selected':''}>2 timer før</option><option value="-P1D" ${x.rem==='-P1D'?'selected':''}>1 dag før</option><option value="-P2D" ${x.rem==='-P2D'?'selected':''}>2 dage før</option><option value="-P7D" ${x.rem==='-P7D'?'selected':''}>1 uge før</option></select></div></div><div class="notes"><label>Noter</label><textarea rows="2" oninput="updateTask(${x.id},'notes',this.value,false)">${esc(x.notes)}</textarea></div></div>`}async function systemNote(title,body){try{if(Notification.permission!=="granted")return;if("serviceWorker" in navigator){const r=await navigator.serviceWorker.ready;await r.showNotification(title,{body,icon:"icon.svg",badge:"icon.svg",tag:"ejaps-status"})}else new Notification(title,{body})}catch(e){}}function toastMsg(s){toast.textContent=s;toast.style.display="block";setTimeout(()=>toast.style.display="none",3000)}window.toggleTask=id=>{const x=tasks.find(y=>y.id===id),was=x.done;x.done=!x.done;persist();if(!was&&x.done){const p=pct();systemNote("EJ ApS · Opgave færdig",`${x.title} · Fremdrift ${p}%`);toastMsg(`Færdig: ${x.title} · ${p}% gennemført`)}};window.updateTask=(id,f,v,r=true)=>{const x=tasks.find(y=>y.id===id);x[f]=v;persist(r);if(!r)stats()};window.deleteTask=id=>{if(confirm("Slet opgaven?")){tasks=tasks.filter(x=>x.id!==id);persist()}};notifyBtn.onclick=async()=>{if(!("Notification" in window))return alert("Denne browser understøtter ikke systemnotifikationer.");const p=await Notification.requestPermission();if(p==="granted"){notifyBtn.textContent="Notifikationer aktive";toastMsg("Notifikationer er aktiveret")}else alert("Notifikationer blev ikke tilladt. Du kan ændre det i browserens indstillinger.")};function icsEsc(s){return String(s??"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;")}function vevent(x){if(!x.date)return"";const tm=(x.time||"09:00").replace(":",""),start=x.date.replaceAll("-","")+"T"+tm+"00",en=new Date(x.date+"T"+(x.time||"09:00"));en.setMinutes(en.getMinutes()+30);const pad=n=>String(n).padStart(2,"0"),end=`${en.getFullYear()}${pad(en.getMonth()+1)}${pad(en.getDate())}T${pad(en.getHours())}${pad(en.getMinutes())}00`,a=["BEGIN:VEVENT",`UID:ejaps-${x.id}@todo`,`DTSTART;TZID=Europe/Copenhagen:${start}`,`DTEND;TZID=Europe/Copenhagen:${end}`,`SUMMARY:${icsEsc(x.title)}`,`DESCRIPTION:${icsEsc("Kategori: "+x.cat+"\nAnsvarlig: "+x.owner+(x.notes?"\nNoter: "+x.notes:""))}`];if(x.rem)a.push("BEGIN:VALARM",`TRIGGER:${x.rem}`,"ACTION:DISPLAY",`DESCRIPTION:${icsEsc("Påmindelse: "+x.title)}`,"END:VALARM");a.push("END:VEVENT");return a.join("\r\n")}function downloadICS(name,text){const b=new Blob([text],{type:"text/calendar;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click()}window.oneCalendar=id=>{const x=tasks.find(y=>y.id===id);if(!x.date)return alert("Tilføj først en dato");downloadICS("EJ-ApS-opgave.ics",["BEGIN:VCALENDAR","VERSION:2.0",vevent(x),"END:VCALENDAR"].join("\r\n"))};calendarBtn.onclick=()=>{const a=tasks.filter(x=>x.date);if(!a.length)return alert("Ingen tidsfrister endnu");downloadICS("EJ-ApS-deadlines.ics",["BEGIN:VCALENDAR","VERSION:2.0",...a.map(vevent),"END:VCALENDAR"].join("\r\n"))};addBtn.onclick=()=>{if(!newTitle.value.trim())return;tasks.push({id:Date.now(),title:newTitle.value.trim(),cat:newCategory.value,done:false,owner:newOwner.value,date:newDate.value,time:newTime.value||"09:00",rem:"-P1D",notes:""});newTitle.value="";persist()};[search,ownerFilter,statusFilter,deadlineFilter].forEach(x=>x.oninput=render);newCategory.innerHTML=C.map(x=>`<option>${esc(x)}</option>`).join("");if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");if("Notification" in window&&Notification.permission==="granted")notifyBtn.textContent="Notifikationer aktive";render()</script></body></html>
